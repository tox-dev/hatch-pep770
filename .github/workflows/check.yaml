name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "27 8 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: 🧪 test
    if: github.event_name != 'schedule' || github.repository_owner == 'gaborbernat'
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@e1361e2efa1e9dd9705bb9be719d923cd9154707 # 6.7.1
    permissions:
      contents: read
    with:
      include: |
        [
          {"env": "3.15", "python": "3.15"},
          {"env": "3.14", "python": "3.14"},
          {"env": "3.13", "python": "3.13"},
          {"env": "3.12", "python": "3.12"},
          {"env": "3.11", "python": "3.11"},
          {"env": "3.15", "python": "3.15", "os": "windows-2025"},
          {"env": "3.11", "python": "3.11", "os": "windows-2025"},
          {"env": "3.15", "python": "3.15", "os": "macos-26"},
          {"env": "dev"},
          {"env": "docs"},
          {"env": "fix"},
          {"env": "type"},
          {"env": "pkg_meta"}
        ]
  release:
    name: 🏷️ Release dry run
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@0c4cffd63033d38196319524d101caae1eef925b # 6.7.2
    permissions:
      contents: read
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, release, hooks]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@e1361e2efa1e9dd9705bb9be719d923cd9154707 # 6.7.1
        with:
          needs: ${{ toJSON(needs) }}
