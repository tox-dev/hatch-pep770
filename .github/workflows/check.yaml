name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "27 8 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: 🧪 test
    if: github.event_name != 'schedule' || github.repository == 'tox-dev/python-sbom'
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    permissions:
      contents: read
    with:
      include: |
        [
          {"env": "3.15", "python": "3.15"},
          {"env": "3.14", "python": "3.14"},
          {"env": "3.13", "python": "3.13"},
          {"env": "3.12", "python": "3.12"},
          {"env": "3.11", "python": "3.11"},
          {"env": "3.15", "python": "3.15", "os": "windows-2025"},
          {"env": "3.11", "python": "3.11", "os": "windows-2025"},
          {"env": "3.15", "python": "3.15", "os": "macos-26"},
          {"env": "dev"},
          {"env": "docs"},
          {"env": "fix"},
          {"env": "type"},
          {"env": "pkg_meta"},
          {"env": "example-cibuildwheel", "python": "3.15"},
          {"env": "example-flit_core", "python": "3.15"},
          {"env": "example-hatchling", "python": "3.15"},
          {"env": "example-maturin", "python": "3.15"},
          {"env": "example-meson_python", "python": "3.15"},
          {"env": "example-pdm_backend", "python": "3.15"},
          {"env": "example-poetry_core", "python": "3.15"},
          {"env": "example-scikit_build_core", "python": "3.15"},
          {"env": "example-setuptools", "python": "3.15"},
          {"env": "example-uv_build", "python": "3.15"},
          {"env": "example-zipapp", "python": "3.15"},
          {"env": "example-delocate", "python": "3.15", "os": "macos-26"}
        ]
  release:
    name: 🏷️ Release dry run
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  build:
    # the release's own build, with the hashed build requirements the lock pins, so a pull request that would fail it
    # fails here instead of after the release is tagged
    name: 🏗️ Release build
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    permissions:
      contents: read
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    permissions:
      contents: read
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, release, build, hooks]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@6.8.1
        with:
          needs: ${{ toJSON(needs) }}
