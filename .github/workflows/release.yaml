name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: 🏗️ Build
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    permissions:
      contents: read
  notes:
    name: 📝 Render GitHub Release notes
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: docs/changelog.rst
      artifact-url: https://pypi.org/project/python-sbom/${{ github.ref_name }}/
  publish:
    name: 🚀 Publish to PyPI
    needs: [build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/python-sbom/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist/
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          attestations: true
          packages-dir: dist
  release:
    name: 🚀 Publish GitHub Release
    needs: [build, publish, notes]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    permissions:
      contents: write
    with:
      project: python-sbom
      version: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
      artifact-pattern: python-package-distributions
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
