name: Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  changelog:
    name: 📝 News fragment
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@0c4cffd63033d38196319524d101caae1eef925b # 6.7.2
        with:
          groups: release-news
          exclude-newer-package: nab=2026-11-05T05:51:00Z
          venv: ${{ runner.temp }}/release-tools
      - name: 🔍 Validate changelog fragments
        uses: tox-dev/github-workflows/validate-news@0c4cffd63033d38196319524d101caae1eef925b # 6.7.2
