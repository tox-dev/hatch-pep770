[package]
name = "python-sbom"
version = "0.1.0"
edition = "2024"
description = "SBOMs for Python distributions: write PEP 770 CycloneDX SBOMs into wheels."
license = "MIT"
repository = "https://github.com/tox-dev/python-sbom"
rust-version = "1.93"
publish = false

[lib]
name = "_core"
path = "rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
blake2 = "0.11.0"
crc32fast = "1.5.4"
digest = "0.11"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
jsonschema = { version = "0.60.2", default-features = false }
md-5 = "0.11.0"
memmap2 = "0.9.12"
pep440_rs = "0.7.3"
pyo3 = { version = "0.30.1", features = ["generate-import-lib"] }
rayon = "1.12.0"
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
uuid = { version = "1.29.1", features = ["v5"] }

[features]
extension-module = ["pyo3/extension-module"]
# per-version wheels drop it, as free-threaded builds need until PEP 803's abi3t loader ships
abi3 = ["pyo3/abi3-py311"]
default = ["extension-module", "abi3"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
