[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.28", "python-sbom" ]

[project]
name = "seeder"
version = "1.0"
description = "Seeds new environments with the wheels it bundles"
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Maintainer", email = "maintainer@example.com" } ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
urls.Source = "https://github.com/example/seeder"

[tool.hatch]
build.hooks.custom = {}
build.targets.wheel.packages = [ "src/seeder" ]

[tool.python-sbom]
supplier = { name = "Example Org", url = [ "https://example.org" ] }
bundled-wheels = [ "src/seeder/embed/*.whl" ]
